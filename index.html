<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Congressional App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="nav-bar">
    <a class="navname" href="/">
      Air AI.
    </a>
  
    <ul class="nav-dropdown" id="navDropdown">
      <li>
        <a href="#home">
        Home
      </a>
    </li>
    <li>
      <a href="#air">
        Air
      </a>
    </li>
    <li>
      <a href="#weather">
        Weather
      </a>
    </li>
    </ul> 
  </div>

  <main>
    <section id="home">
      <h1>
        Home
      </h1>
    </section>
    <section id="air">
      <h1>
        Air
      </h1>
      <form id="airForm">
        <input type="text" id="airCityInput" placeholder="enter a city" required>
        <button type="submit">
         Get Air Quality
        </button>
        <div id="airResult">

        </div>
      </form>
    </section>
    <section id="weather">
      <h1>
        Weather
      </h1>
      <form id="weatherForm">
        <input id="cityInput" type="text" required placeholder="Enter A City">
        <button type="submit">
          Submit
        </button>
      </form>
      <div id="weatherResult">
         
      </div>
    </section>

  </main>
  <script src="script.js" defer></script>
</body>
</html>
